<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeaveSync - Login</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>
<!-- this is test -->
    <main class="auth-page">
        <div class="auth-card">
            <!-- LOGO -->
            <div class="auth-logo">
                <img src="logo.png" alt="LeaveSync Logo">
            </div>


            <!-- HEADING -->
            <div class="auth-heading">
                <h1>Welcome Back</h1>
                <p>
                    Login to your LeaveSync account
                </p>
            </div>


            <!-- LOGIN FORM -->
            <form class="auth-form">

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <!-- FORGOT PASSWORD -->
                <div class="forgot-row">
                    <button type="button" class="forgot-btn">
                        Forgot Password?
                    </button>
                </div>

                <!-- LOGIN -->
                <button type="submit" class="primary-btn">
                    Login
                </button>
            </form>

            <!-- BOTTOM SWITCH -->
            <div class="auth-switch">
                <span>
                    Don't have an account?
                </span>
                <a href="registration.html">
                    Sign Up
                </a>
            </div>
        </div>
    </main>
</body>
</html>
